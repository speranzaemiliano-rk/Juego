    <line x1="43.22" y1="52" x2="29.36" y2="44"/>
  </g>
  <circle cx="64" cy="64" r="7" fill="#ffffff"/>
  <!-- wordmark -->
  <text x="150" y="83" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"
